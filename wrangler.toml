
name = "tradepilot-ai"
main = "src/index.js"
compatibility_date = "2026-10-28"
workers_dev = true

[[kv_namespaces]]
binding = "TP_STATE"
id = "c6ebb2469afe4e8ebe236097ccb97d63"

[triggers]
crons = ["*/3 * * * *"]

[observability.logs]
enabled = true
head_sampling_rate = 1.0
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1.0
persist = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = [
  "/health",
  "/status",
  "/dashboard-data",
  "/assistant-chat",
  "/analyze",
  "/scalp",
  "/gold*",
  "/calendar",
  "/calendar-key-check",
  "/sniper-stats",
  "/edge-stats",
  "/telegram-test"
]

[ai]
binding = "AI"
