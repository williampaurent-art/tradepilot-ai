
name = "tradepilot-ai"
main = "src/index.js"
compatibility_date = "2026-10-28"
workers_dev = true

[[kv_namespaces]]
binding = "TP_STATE"
id = "c6ebb2469afe4e8ebe236097ccb97d63"

[triggers]
crons = ["*/5 * * * *"]

[observability.logs]
enabled = true
head_sampling_rate = 1.0
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1.0
persist = true
