<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d17"><title>Connexion · TradePilot AI</title>
<style>
:root{color-scheme:dark;--bg:#080d17;--panel:#111a2a;--line:#263650;--text:#edf3fc;--muted:#91a1b9;--gold:#f3c86b;--green:#42d6a0;--red:#ff7185}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(ellipse at 50% 0,rgba(55,98,151,.22),transparent 45%),var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(100%,440px);padding:25px;background:linear-gradient(150deg,#152238,#0e1726);border:1px solid var(--line);border-radius:19px;box-shadow:0 22px 70px #0007}.brand{font-weight:900;font-size:20px}.eyebrow{font-size:10px;letter-spacing:1.5px;color:var(--gold);font-weight:900;margin-top:24px}h1{font-size:26px;letter-spacing:-.7px;margin:5px 0}.muted{color:var(--muted);font-size:12px;line-height:1.65}label{display:block;color:var(--muted);font-size:12px;margin:15px 0 6px}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;background:#080f1b;color:var(--text);font:inherit}input:focus{outline:1px solid var(--gold)}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:20px 0 5px}.tabs button,.submit{border:1px solid var(--line);border-radius:10px;padding:11px;background:#1a2940;color:var(--text);font-weight:800}.tabs button.active,.submit{background:var(--gold);border-color:var(--gold);color:#211a0c}.submit{width:100%;margin-top:18px;padding:13px}.msg{min-height:38px;margin-top:12px;font-size:12px;color:var(--muted)}a{color:var(--gold);text-decoration:none}.foot{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:10px;color:var(--muted)}
</style></head><body><main class="card"><div class="brand">◈ TradePilot AI</div><div class="eyebrow">ESPACE CLIENT SÉCURISÉ</div><h1 id="title">Connexion</h1><p class="muted">Connecte-toi pour retrouver tes stratégies et tes signaux personnels sur tous tes appareils.</p>
<div class="tabs"><button type="button" id="loginTab" class="active">Connexion</button><button type="button" id="signupTab">Créer un compte</button></div>
<form id="authForm"><label for="email">Adresse e-mail</label><input id="email" type="email" autocomplete="email" required maxlength="320" placeholder="toi@exemple.com"><label for="password">Mot de passe</label><input id="password" type="password" autocomplete="current-password" required minlength="8" placeholder="8 caractères minimum"><button class="submit" id="submit" type="submit">Se connecter</button></form><div id="message" class="msg" role="status"></div><div class="foot">Connexion sécurisée via Supabase. Tes bots sont isolés dans ton espace TradePilot. Aucun ordre réel n’est envoyé.</div></main>
<script>
const $=id=>document.getElementById(id),SESSION_KEY='tradepilot_auth_session';let mode='login',cfg=null;
function showMode(next){mode=next;$('loginTab').classList.toggle('active',mode==='login');$('signupTab').classList.toggle('active',mode==='signup');$('title').textContent=mode==='login'?'Connexion':'Créer mon compte';$('submit').textContent=mode==='login'?'Se connecter':'Créer mon compte';$('password').autocomplete=mode==='login'?'current-password':'new-password';$('message').textContent='';}
$('loginTab').onclick=()=>showMode('login');$('signupTab').onclick=()=>showMode('signup');
async function config(){const r=await fetch('/api/public-config',{cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Configuration Supabase indisponible.');cfg=d;}
function saveSession(session){localStorage.setItem(SESSION_KEY,JSON.stringify({access_token:session.access_token,refresh_token:session.refresh_token,expires_at:Date.now()+Number(session.expires_in||3600)*1000}));}
$('authForm').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('message').textContent='Connexion à Supabase…';try{if(!cfg)await config();const email=$('email').value.trim(),password=$('password').value;const endpoint=mode==='login'?'/auth/v1/token?grant_type=password':'/auth/v1/signup';const r=await fetch(cfg.supabaseUrl+endpoint,{method:'POST',headers:{'content-type':'application/json','apikey':cfg.publishableKey},body:JSON.stringify({email,password})});const d=await r.json();if(!r.ok)throw Error(d.msg||d.message||d.error_description||d.error||'Authentification refusée.');if(d.access_token){saveSession(d);location.replace('/bots.html');return;}if(mode==='signup'){$('message').textContent='Compte créé. Vérifie ta boîte e-mail pour confirmer ton adresse, puis connecte-toi.';showMode('login');}else throw Error('Aucune session reçue.');}catch(err){$('message').textContent=err.message;}finally{$('submit').disabled=false;}};
config().catch(e=>$('message').textContent=e.message);
</script></body></html>
