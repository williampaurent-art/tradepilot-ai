
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TradePilot AI</title>
  <style>
    body {
      margin: 0;
      padding: 24px 16px;
      background: #101522;
      color: #f5f7ff;
      font-family: Arial, sans-serif;
    }
    main {
      max-width: 650px;
      margin: 40px auto;
      padding: 24px;
      background: #1b2334;
      border-radius: 16px;
    }
    h1 { margin-top: 0; }
    p { color: #c3cbe0; line-height: 1.5; }
    label {
      display: block;
      margin: 20px 0 8px;
      font-weight: bold;
    }
    textarea, input, select, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-bottom: 14px;
      border-radius: 8px;
      font-size: 16px;
    }
    textarea, input, select {
      background: #0e1421;
      color: white;
      border: 1px solid #495570;
    }
    textarea { min-height: 120px; resize: vertical; }
    button {
      background: #6d8cff;
      color: #101522;
      font-weight: bold;
      border: 0;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #0e1421;
      padding: 16px;
      border-radius: 8px;
      color: #dce5ff;
    }
    .status { color: #a8f0c6; }
    .warning { font-size: 13px; }
  </style>
</head>
<body>
<main>
  <h1>TradePilot AI</h1>
  <p>Transforme une idée en brouillon de stratégie de trading.</p>

  <form id="strategyForm">
    <label for="idea">Décris ta stratégie</label>
    <textarea id="idea" required minlength="5"
      maxlength="2000"
      placeholder="Ex. : Croisement de moyennes mobiles sur EURUSD en M15"></textarea>

    <label for="symbol">Instrument</label>
    <input id="symbol" value="EURUSD" required>

    <label for="timeframe">Unité de temps</label>
    <select id="timeframe">
      <option>M5</option>
      <option>M15</option>
      <option>M30</option>
      <option>H1</option>
      <option>H4</option>
      <option>D1</option>
    </select>

    <button id="draftButton" type="submit">
      Préparer un brouillon
    </button>
  </form>

  <h2>Résultat</h2>
  <p id="status" class="status" role="status" aria-live="polite">
    Prêt.
  </p>
  <pre id="draftResult">Ta stratégie apparaîtra ici.</pre>
  <p class="warning">
    Mode démo : aucun backtest n'est exécuté et aucun ordre réel n'est envoyé.
    Les paramètres générés ne sont pas validés pour un usage financier.
  </p>
</main>

<script>
const API_URL =
  "https://tradepilot-ai.williampaurent.workers.dev";

const form = document.getElementById("strategyForm");
const button = document.getElementById("draftButton");
const statusText = document.getElementById("status");
const result = document.getElementById("draftResult");

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const idea = document.getElementById("idea").value.trim();
  const symbol = document.getElementById("symbol").value.trim();
  const timeframe = document.getElementById("timeframe").value;

  if (idea.length < 5 || !symbol) {
    statusText.textContent = "Complète les champs demandés.";
    return;
  }

  button.disabled = true;
  statusText.textContent = "Envoi de la demande...";
  result.textContent = "";

  try {
    const response = await fetch(
      API_URL + "/api/strategies/drafts",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          name: "Ma stratégie",
          description: idea,
          symbol: symbol,
          timeframe: timeframe
        })
      }
    );

    const data = await response.json();

    if (!response.ok || data.status !== "draft_created") {
      throw new Error(
        data.message || "Le serveur n'a pas créé le brouillon."
      );
    }

    statusText.textContent = "Brouillon reçu du serveur.";
    result.textContent = JSON.stringify(data, null, 2);

  } catch (error) {
    statusText.textContent = "La demande a échoué.";
    result.textContent =
      error.message +
      "\n\nVérifie la connexion et la configuration du serveur Cloudflare.";
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
