name: Bot engine tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bot-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run deterministic bot engine tests
        run: node --test tests/bot-engine.test.mjs
