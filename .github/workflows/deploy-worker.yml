name: Deploy TradePilot Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "migrations/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-worker.yml"
      - "scripts/cloudflare-preflight.mjs"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run full test suite
        run: node --test tests/*.test.mjs

      - name: Require deployment credentials
        shell: bash
        run: |
          missing=()
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || missing+=("CLOUDFLARE_API_TOKEN")
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          [[ -n "$SUPABASE_PUBLISHABLE_KEY" ]] || missing+=("SUPABASE_PUBLISHABLE_KEY")
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Deployment blocked. Missing GitHub Actions secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Verify rate-limit namespace uniqueness (read-only)
        run: node scripts/cloudflare-preflight.mjs

      - name: Validate Worker bundle without deploying
        run: npx --yes wrangler@latest deploy --dry-run --var "SUPABASE_PUBLISHABLE_KEY:$SUPABASE_PUBLISHABLE_KEY"

      - name: Inspect remote D1 migration state (read-only)
        run: npx --yes wrangler@latest d1 migrations list tradepilot-ai-db --remote

      - name: Apply D1 migrations and deploy Worker
        shell: bash
        run: |
          npx --yes wrangler@latest d1 migrations apply tradepilot-ai-db --remote
          npx --yes wrangler@latest deploy --var "SUPABASE_PUBLISHABLE_KEY:$SUPABASE_PUBLISHABLE_KEY"

      - name: Verify deployed Worker
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base = "https://tradepilot-ai.williampaurent.workers.dev";
          const healthResponse = await fetch(base + "/health");
          const health = await healthResponse.json();
          if (!healthResponse.ok || health.ok !== true || health.liveTrading !== false) {
            throw new Error("Worker health check failed or live trading safety flag is not false.");
          }
          const configResponse = await fetch(base + "/api/public-config");
          const config = await configResponse.json();
          if (!configResponse.ok || config.ok !== true || !config.supabaseUrl || !config.publishableKey) {
            throw new Error("Supabase public configuration check failed.");
          }
          console.log(JSON.stringify({
            health: health.status,
            instrument: health.instrument,
            supabaseConfig: "available",
            liveTrading: health.liveTrading,
            execution: health.execution
          }));
          NODE
