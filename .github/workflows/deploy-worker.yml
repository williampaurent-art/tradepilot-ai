name: Deploy TradePilot Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "migrations/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run bot engine tests
        run: node --test tests/bot-engine.test.mjs

      - name: Check deployment credentials
        id: credentials
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Worker deployment skipped. Configure CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and SUPABASE_PUBLISHABLE_KEY in repository Actions secrets."
          fi

      - name: Apply D1 migrations and deploy Worker
        if: steps.credentials.outputs.configured == 'true'
        shell: bash
        run: |
          npx --yes wrangler@latest d1 migrations apply tradepilot-ai-db --remote
          npx --yes wrangler@latest deploy --var "SUPABASE_PUBLISHABLE_KEY:$SUPABASE_PUBLISHABLE_KEY"

      - name: Verify deployed Worker
        if: steps.credentials.outputs.configured == 'true'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base = "https://tradepilot-ai.williampaurent.workers.dev";
          const healthResponse = await fetch(base + "/health");
          const health = await healthResponse.json();
          if (!healthResponse.ok || health.ok !== true || health.liveTrading !== false) {
            throw new Error("Worker health check failed or live trading safety flag is not false.");
          }
          const configResponse = await fetch(base + "/api/public-config");
          const config = await configResponse.json();
          if (!configResponse.ok || config.ok !== true || !config.supabaseUrl || !config.publishableKey) {
            throw new Error("Supabase public configuration check failed.");
          }
          console.log(JSON.stringify({
            health: health.status,
            instrument: health.instrument,
            supabaseConfig: "available",
            liveTrading: health.liveTrading,
            execution: health.execution
          }));
          NODE

      - name: Deployment readiness summary
        if: steps.credentials.outputs.configured == 'false'
        run: echo "Not deployed; repository secrets are missing. No production resources were changed."
