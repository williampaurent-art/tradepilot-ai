name: TradePilot CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/saas-foundation]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker syntax
        run: node --input-type=module --check < src/index.js
      - name: Check frontend JavaScript syntax
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import vm from "node:vm";
          for (const file of ["public/auth.html", "public/portal.html", "public/session.js"]) {
            const source = readFileSync(file, "utf8");
            const scripts = [];
            if (file.endsWith(".js")) scripts.push(source);
            else {
              for (const chunk of source.split("<script").slice(1)) {
                const tagEnd = chunk.indexOf(">");
                if (tagEnd < 0 || chunk.slice(0, tagEnd).includes("src=")) continue;
                scripts.push(chunk.slice(tagEnd + 1).split("</script>")[0]);
              }
            }
            for (const script of scripts) new vm.Script(script, { filename: file });
          }
          NODE
      - name: Run tests
        run: node --test tests/*.test.mjs
