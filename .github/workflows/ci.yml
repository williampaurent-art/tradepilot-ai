name: TradePilot CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/saas-foundation]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker syntax
        run: node --input-type=module --check < src/index.js
      - name: Check deployment preflight script syntax
        run: node --check scripts/cloudflare-preflight.mjs
      - name: Check frontend JavaScript syntax
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import vm from "node:vm";
          for (const file of ["public/auth.html", "public/portal.html", "public/partner-dashboard.html", "public/session.js"]) {
            const source = readFileSync(file, "utf8");
            const scripts = [];
            if (file.endsWith(".js")) scripts.push(source);
            else {
              for (const chunk of source.split("<script").slice(1)) {
                const tagEnd = chunk.indexOf(">");
                if (tagEnd < 0 || chunk.slice(0, tagEnd).includes("src=")) continue;
                scripts.push(chunk.slice(tagEnd + 1).split("</script>")[0]);
              }
            }
            for (const script of scripts) new vm.Script(script, { filename: file });
          }
          NODE
      - name: Require deployment secrets on trusted branch push
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          missing=()
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || missing+=("CLOUDFLARE_API_TOKEN")
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          [[ -n "$SUPABASE_PUBLISHABLE_KEY" ]] || missing+=("SUPABASE_PUBLISHABLE_KEY")
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing required GitHub Actions secrets: %s\\n' "${missing[*]}"
            exit 1
          fi
          echo "All required deployment secrets are present (values are never printed)."
      - name: Verify Cloudflare rate-limit namespaces (read-only)
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/cloudflare-preflight.mjs
      - name: Validate Cloudflare Worker bundle without deploying
        run: npx --yes wrangler@latest deploy --dry-run
      - name: Run tests
        run: node --test tests/*.test.mjs
